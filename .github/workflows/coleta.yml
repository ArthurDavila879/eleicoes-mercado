name: Coleta de dados

# Horários em UTC. America/Sao_Paulo = UTC-3 (sem horário de verão desde 2019).
# Pregão da B3: ~10h às 18h de Brasília = 13h às 21h UTC.
on:
  schedule:
    # Minutos "quebrados": o GitHub atrasa ou descarta agendamentos no começo da hora
    - cron: "17 13-21 * * 1-5"  # de hora em hora (minuto 17) em dias úteis, 10:17–18:17 BRT
    - cron: "47 1 * * *"        # uma vez à noite, todos os dias: 22:47 BRT
  workflow_dispatch:

permissions:
  contents: write

# Evita duas coletas simultâneas disputando o push
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar eventos
        run: python -m src.eventos.validacao

      # O GDELT é diário e limita requisições por IP: só entra na rodada noturna
      # (e na manual). As rodadas de hora em hora coletam BCB, Yahoo e Binance.
      - name: Coleta incremental
        run: |
          if [ "${{ github.event.schedule }}" = "17 13-21 * * 1-5" ]; then
            python -m src.ingestao --fontes bcb_sgs yahoo binance
          else
            python -m src.ingestao
          fi

      # Parquet é binário: o git não mescla se o main mudou durante a coleta.
      # Guardamos a coleta, voltamos ao main atualizado e mesclamos pelas chaves
      # (sem refazer a coleta, que leva minutos por causa do limite do GDELT).
      - name: Commitar Parquet novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r data/bruto "$RUNNER_TEMP/bruto_coletado"
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python -m src.ingestao.mesclar "$RUNNER_TEMP/bruto_coletado"
            git add data/bruto
            if git diff --cached --quiet; then
              echo "Sem dados novos."
              exit 0
            fi
            git commit -m "dados: coleta automática $(date -u +'%Y-%m-%dT%H:%MZ')"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push recusado (tentativa $tentativa); mesclando de novo sobre o remoto."
            sleep $((tentativa * 10))
          done
          exit 1

      # Depois do commit (os dados novos já estão salvos): constrói o banco e confere se todas
      # as séries têm dado recente (no máximo 2 dias úteis de atraso; GDELT só avisa).
      # Uma falha aqui marca a execução como falha e abre/comenta a issue abaixo.
      - name: Verificar atualização das fontes
        run: python -m src.pipeline --sem-coleta --verificar-atualizacao

  # Abre uma issue quando a coleta falha; se já houver uma aberta, só comenta nela
  avisar_falha:
    needs: coletar
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir ou comentar a issue de falha da coleta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rotulo="coleta-falhou"
          quando="$(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M') (Brasília)"
          aberta=$(gh issue list --state open --label "$rotulo" --json number --jq '.[0].number // empty')
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body "Nova falha em $quando: $EXECUCAO"
          else
            gh label create "$rotulo" --color B60205 --description "Falha na coleta automática" || true
            gh issue create --label "$rotulo" --title "Coleta automática falhou" --body "A coleta de dados falhou em $quando.

          Execução: $EXECUCAO

          Causas comuns: fonte fora do ar ou recusando requisições, mudança no formato da resposta, conflito no push dos Parquet, ou série sem dado novo há mais de 2 dias úteis (passo \"Verificar atualização das fontes\").

          Esta issue recebe um comentário a cada nova falha enquanto estiver aberta. Feche-a quando a coleta voltar a funcionar."
          fi
