name: Coleta de dados

# Horários em UTC. America/Sao_Paulo = UTC-3 (sem horário de verão desde 2019).
# Pregão da B3: ~10h às 18h de Brasília = 13h às 21h UTC.
on:
  schedule:
    # Minutos "quebrados": o GitHub atrasa ou descarta agendamentos no começo da hora
    - cron: "17 13-21 * * 1-5"  # de hora em hora (minuto 17) em dias úteis, 10:17–18:17 BRT
    - cron: "47 1 * * *"        # uma vez à noite, todos os dias: 22:47 BRT
  workflow_dispatch:

permissions:
  contents: write

# Evita duas coletas simultâneas disputando o push
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar eventos
        run: python -m src.eventos.validacao

      - name: Coleta incremental
        run: python -m src.ingestao

      - name: Commitar Parquet novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bruto
          if git diff --cached --quiet; then
            echo "Sem dados novos."
            exit 0
          fi
          git commit -m "dados: coleta automática $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Se alguém publicou Parquet no meio do caminho, o rebase de arquivo binário conflita:
          # nesse caso parte do remoto e refaz a coleta (é incremental e idempotente)
          for tentativa in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Conflito no push (tentativa $tentativa): refazendo a coleta sobre o remoto."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python -m src.ingestao
            git add data/bruto
            if git diff --cached --quiet; then
              echo "Sem dados novos após refazer."
              exit 0
            fi
            git commit -m "dados: coleta automática $(date -u +'%Y-%m-%dT%H:%MZ')"
          done
          exit 1
