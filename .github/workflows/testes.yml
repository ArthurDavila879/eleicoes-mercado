name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: pytest (sem rede, respostas mockadas)
        run: pytest -q

      - name: Pipeline com os dados versionados (carga + dbt build)
        run: python -m src.pipeline --sem-coleta
