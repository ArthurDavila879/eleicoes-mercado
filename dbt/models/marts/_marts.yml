version: 2

models:
  - name: fct_parametros_modelo
    description: Parâmetros do retorno normal (alfa, beta, sigma²) por frequência × evento × ativo
    tests:
      - combinacao_unica:
          arguments:
            colunas: [frequencia, evento_id, ativo]
    columns:
      - name: modelo_retorno_normal
        tests:
          - accepted_values:
              arguments:
                values: [mercado, mercado_global, media_constante, controle_moedas]
      - name: sigma2
        tests: [not_null]

  - name: fct_retornos_anormais
    description: Retornos anormais e CAR acumulado em cada dia/barra da janela do evento
    tests:
      - combinacao_unica:
          arguments:
            colunas: [frequencia, evento_id, ativo, rel]
    columns:
      - name: retorno_anormal
        tests: [not_null]
      - name: evento_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_eventos')
                field: evento_id

  - name: fct_car_eventos
    description: CAR, erro-padrão, estatística t e status por evento × ativo × frequência
    tests:
      - combinacao_unica:
          arguments:
            colunas: [frequencia, evento_id, ativo]
    columns:
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [completo, janela_parcial, aguardando_dados, estimacao_insuficiente]
      - name: frequencia
        tests:
          - accepted_values:
              arguments:
                values: [diaria, horaria]

  - name: resultados_eventos
    description: Tabela final do estudo de evento com p-valor (t de Student) e significância
    tests:
      - combinacao_unica:
          arguments:
            colunas: [frequencia, evento_id, ativo]
    columns:
      - name: significancia
        tests:
          - accepted_values:
              arguments:
                values: ["***", "**", "*", "n.s."]

  # --- Robustez (Fase 1; ver PRE_REGISTRO.md, seção 5) ---
  - name: fct_testes_robustez
    description: Patell, BMP (série temporal) e Corrado na janela principal, com Holm na família principal
    config: &config_robustez
      # Os modelos Python só enxergam chaves de config lidas com nome literal: as vars do
      # projeto vão juntas num JSON (lido por robustez.ler_parametros)
      parametros_robustez: '{{ tojson({"janela_diaria_inicio": var("janela_diaria_inicio"), "janela_diaria_fim": var("janela_diaria_fim"), "janela_horaria_inicio": var("janela_horaria_inicio"), "janela_horaria_fim": var("janela_horaria_fim"), "estimacao_diaria_inicio": var("estimacao_diaria_inicio"), "estimacao_diaria_fim": var("estimacao_diaria_fim"), "estimacao_horaria_inicio": var("estimacao_horaria_inicio"), "estimacao_horaria_fim": var("estimacao_horaria_fim"), "min_obs_estimacao_diaria": var("min_obs_estimacao_diaria"), "min_obs_estimacao_horaria": var("min_obs_estimacao_horaria"), "familia_principal": var("familia_principal"), "janelas_sensibilidade": var("janelas_sensibilidade"), "placebo_n": var("placebo_n"), "placebo_semente": var("placebo_semente"), "placebo_inicio": var("placebo_inicio"), "inicio_analise_horaria": var("inicio_analise_horaria"), "fuso_offset_horas": var("fuso_offset_horas"), "hora_corte_pregao": var("hora_corte_pregao")}) }}'
    tests:
      - combinacao_unica:
          arguments:
            colunas: [frequencia, evento_id, ativo]

  - name: fct_sensibilidade_janelas
    description: CAR e p-valor (teste t principal) nas janelas diárias [0,0], [0,+1], [-1,+3] e [-5,+5]
    config: *config_robustez
    tests:
      - combinacao_unica:
          arguments:
            colunas: [evento_id, ativo, janela]

  - name: fct_placebo_distribuicao
    description: CAR de pseudoeventos sem evento (placebo) por ativo × frequência × versão
    config: *config_robustez
    tests:
      - combinacao_unica:
          arguments:
            colunas: [frequencia, ativo, versao, idx0]
    columns:
      - name: versao
        tests:
          - accepted_values:
              arguments:
                values: [restrita, irrestrita]

  - name: fct_placebo_resultados
    config: *config_robustez
    description: p-valor empírico bicaudal do CAR real contra a distribuição placebo
    tests:
      - combinacao_unica:
          arguments:
            colunas: [frequencia, evento_id, ativo, versao]

  # --- Análises adicionais (Fase 2; ver PRE_REGISTRO.md, seção 6) ---
  - name: fct_atividade_anormal
    description: Volatilidade realizada (barras de 1h) e volume anormais, em log, na janela diária
    config: *config_robustez
    tests:
      - combinacao_unica:
          arguments:
            colunas: [medida, evento_id, ativo]
    columns:
      - name: medida
        tests:
          - accepted_values:
              arguments:
                values: [volatilidade_realizada, volume]

  - name: fct_caar_eventos
    description: Análise agregada entre eventos (diária) — CAAR, t agregado, t transversal e qui-quadrado sem direção
    tests:
      - combinacao_unica:
          arguments:
            colunas: [grupo, ativo]
