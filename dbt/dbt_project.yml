name: eleicoes_mercado
version: "1.0.0"
config-version: 2
profile: eleicoes

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Fuso de referência America/Sao_Paulo: UTC-3 fixo (sem horário de verão desde 2019)
  fuso_offset_horas: -3
  # Hora local a partir da qual um evento só afeta o pregão seguinte (fechamento da B3)
  hora_corte_pregao: 17
  # Janelas de evento (em pregões / barras de 1h, relativas ao dia/barra 0)
  janela_diaria_inicio: -1
  janela_diaria_fim: 3
  janela_horaria_inicio: -2   # 2 barras de 1h antes do evento
  janela_horaria_fim: 5       # barras 0..5 = 6 horas após o evento
  # Janelas de estimação do modelo (antes do evento, sem sobrepor a janela do evento)
  estimacao_diaria_inicio: -120
  estimacao_diaria_fim: -11
  estimacao_horaria_inicio: -300
  estimacao_horaria_fim: -11
  min_obs_estimacao_diaria: 60
  min_obs_estimacao_horaria: 150
  # Mercado global do modelo do Ibovespa (só na análise diária; ver DECISOES.md)
  ativo_mercado_global: "EEM"
  # Eventos antes desta data só entram na análise diária (não há barras de 1h tão antigas;
  # eleições de 2014, 2018 e 2022)
  inicio_analise_horaria: "2025-01-01"
  # Nº mínimo de moedas de controle com cotação no mesmo dia/hora
  min_moedas_controle: 2
  # Pico isolado no Yahoo diário (log): afasta-se mais que isso dos dois vizinhos e reverte
  limite_pico_isolado: 0.3
  # --- Robustez (Fase 1; parâmetros fixados em PRE_REGISTRO.md) ---
  # Família principal do ajuste de Holm (janela diária; fontes distintas)
  familia_principal: ["^BVSP", "PETR4.SA", "VALE3.SA", "ITUB4.SA", "BBAS3.SA", "BRL=X"]
  # Janelas de sensibilidade (diária), em pregões: início,fim separados por ";"
  janelas_sensibilidade: "0,0;0,1;-1,3;-5,5"
  # Placebo: nº de pseudoeventos por ativo × frequência × versão e semente fixa
  placebo_n: 1000
  placebo_semente: 20261025
  # Pseudodia 0 só desde esta data (histórico do placebo fixado no pré-registro; os preços
  # vão até 2014 por causa das eleições anteriores)
  placebo_inicio: "2023-01-01"

models:
  eleicoes_mercado:
    staging:
      +schema: staging
      +materialized: view
    intermediario:
      +schema: intermediario
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  eleicoes_mercado:
    +schema: referencia
